<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2FABB7" />
    <meta name="content-language" content="ro" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Comar Net" />
    <meta property="og:locale" content="ro_RO" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fallback metadata, used only where no prerendered page exists (the dev
      server). At build time scripts/prerender.mjs replaces everything between
      the seo:start / seo:end markers with the route's own tags from
      src/seo/pages.ts, and useSEO swaps [data-seo] tags on client navigation.
    -->
    <!-- seo:start -->
    <title>
      Comar Net | Distribuție, Logistică și Depozitare pentru Profesioniști
    </title>
    <meta
      name="description"
      content="Comar Net - distribuție de produse alimentare și non-alimentare, logistică și depozitare pentru profesioniști. Peste 18 ani de experiență. Membru Pall-Ex."
      data-seo
    />
    <link rel="canonical" href="https://comarnet.ro/" data-seo />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
      data-seo
    />
    <meta property="og:url" content="https://comarnet.ro/" data-seo />
    <meta
      property="og:title"
      content="Comar Net | Distribuție, Logistică și Depozitare pentru Profesioniști"
      data-seo
    />
    <meta
      property="og:description"
      content="Distribuție de produse alimentare și non-alimentare, logistică și depozitare pentru profesioniști. Peste 18 ani de experiență. Membru Pall-Ex."
      data-seo
    />
    <meta property="og:image" content="https://comarnet.ro/og-image.jpg" data-seo />
    <meta property="og:image:width" content="1200" data-seo />
    <meta property="og:image:height" content="630" data-seo />
    <meta
      property="og:image:alt"
      content="Comar Net - excelență în distribuție"
      data-seo
    />
    <meta
      name="twitter:title"
      content="Comar Net | Distribuție, Logistică și Depozitare pentru Profesioniști"
      data-seo
    />
    <meta
      name="twitter:description"
      content="Distribuție de produse alimentare și non-alimentare, logistică și depozitare pentru profesioniști. Peste 18 ani de experiență. Membru Pall-Ex."
      data-seo
    />
    <meta name="twitter:image" content="https://comarnet.ro/og-image.jpg" data-seo />
    <!-- seo:end -->

    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://www.google.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init({
        once: true,
      });
    </script>
  </body>
</html>
